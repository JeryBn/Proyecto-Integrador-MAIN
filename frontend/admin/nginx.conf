server {
listen 80;
client_max_body_size 13m;
root /usr/share/nginx/html;
location /api { proxy_pass http://django:8090; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
location ~ ^/moderation\.(html|js|css)$ { proxy_pass http://django:8090; proxy_set_header Host $http_host; }
location = /admin.html { try_files /index.html =404; }
location / { try_files $uri $uri/ /index.html; }
}
