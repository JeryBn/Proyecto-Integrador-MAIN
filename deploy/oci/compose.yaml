name: main-production

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  mysql:
    image: mysql:8.4.13
    command:
      - --bind-address=0.0.0.0
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=-05:00
      - --require-secure-transport=ON
      - --ssl-ca=/run/secrets/mysql_ca
      - --ssl-cert=/run/secrets/mysql_server_cert
      - --ssl-key=/run/secrets/mysql_server_key
      - --tls-version=TLSv1.2,TLSv1.3
    environment:
      MYSQL_DATABASE: main
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      TZ: America/Lima
    secrets:
      - mysql_root_password
      - mysql_operator_password
      - mysql_migration_password
      - mysql_spring_password
      - mysql_django_password
      - mysql_retention_password
      - mysql_ca
      - mysql_server_cert
      - mysql_server_key
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init-users.sh:/docker-entrypoint-initdb.d/10-init-users.sh:ro
    networks:
      private:
        ipv4_address: 172.29.0.5
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$(cat /run/secrets/mysql_root_password)\" mysqladmin ping --host=127.0.0.1 --user=root --silent --ssl-mode=VERIFY_CA --ssl-ca=/run/secrets/mysql_ca"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 35s
    restart: unless-stopped
    mem_limit: 2g
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  spring:
    image: main-spring:${MAIN_IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: deploy/oci/spring.Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: production
      MAIN_DB_HOST: mysql
      MAIN_DB_PORT: "3306"
      MAIN_DB_NAME: main
      MAIN_DB_USER: main_spring
      MAIN_DB_PASSWORD_FILE: /run/secrets/mysql_spring_password
      SPRING_FLYWAY_USER: main_migration
      SPRING_FLYWAY_PASSWORD_FILE: /run/secrets/mysql_migration_password
      MAIN_MYSQL_CA_FILE: /run/secrets/mysql_ca
      MAIN_PUSH_ENABLED: ${MAIN_PUSH_ENABLED:-false}
      MAIN_FCM_CREDENTIALS_FILE: ${MAIN_FCM_CREDENTIALS_FILE:-}
      MAIN_PUSH_ENCRYPTION_KEY_FILE: /run/secrets/push_encryption_key
      OPENAI_API_KEY_FILE: /run/secrets/openai_api_key
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      MAIN_MEDIA_FFMPEG_DIRECTORY: /usr/bin
      MAIN_DEMO_ENABLED: "false"
      MAIN_ADMIN_LEGACY_ENABLED: "false"
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: "8088"
      SERVER_TOMCAT_REMOTEIP_INTERNAL_PROXIES: 172\.29\.0\.2
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError
      TZ: America/Lima
    secrets:
      - mysql_spring_password
      - mysql_migration_password
      - mysql_ca
      - push_encryption_key
      - openai_api_key
      - firebase_credentials
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      private:
        ipv4_address: 172.29.0.3
      egress: {}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8088/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 45s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop:
      - ALL
    mem_limit: 2500m
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  django-migrate:
    image: main-django:${MAIN_IMAGE_TAG:-local}
    command: ["migrate"]
    environment: &django-common-environment
      DJANGO_SETTINGS_MODULE: main_admin.production_settings
      MAIN_PUBLIC_ORIGIN: https://${MAIN_DOMAIN}
      MAIN_DB_HOST: mysql
      MAIN_DB_PORT: "3306"
      MAIN_DB_NAME: main
      MAIN_DB_SSL_CA: /run/secrets/mysql_ca
      MAIN_DJANGO_SECRET_KEY_FILE: /run/secrets/django_secret
      MAIN_FFMPEG_EXECUTABLE: /usr/bin/ffmpeg
      MAIN_FFPROBE_EXECUTABLE: /usr/bin/ffprobe
      TZ: America/Lima
    secrets:
      - mysql_migration_password
      - mysql_ca
      - django_secret
    depends_on:
      spring:
        condition: service_healthy
    networks:
      private: {}
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop:
      - ALL
    mem_limit: 768m
    cpus: 0.5
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  database-permissions:
    image: mysql:8.4.13
    entrypoint: ["/opt/main/apply-grants.sh"]
    environment:
      MAIN_DB_HOST_PATTERN: 172.29.0.%
    secrets:
      - mysql_operator_password
      - mysql_ca
    volumes:
      - ./mysql/apply-grants.sh:/opt/main/apply-grants.sh:ro
    depends_on:
      django-migrate:
        condition: service_completed_successfully
    networks:
      private: {}
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    mem_limit: 256m
    cpus: 0.25
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  provision-admin:
    image: main-django:${MAIN_IMAGE_TAG:-local}
    command: ["provision-admin"]
    environment:
      <<: *django-common-environment
      MAIN_ADMIN_USERNAME: ${MAIN_ADMIN_USERNAME:-jery.admin}
      MAIN_ADMIN_DISPLAY_NAME: ${MAIN_ADMIN_DISPLAY_NAME:-Jery Becerra Ninaquispe}
    secrets:
      - mysql_django_password
      - mysql_ca
      - django_secret
      - admin_initial_password
    depends_on:
      database-permissions:
        condition: service_completed_successfully
    networks:
      private: {}
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop:
      - ALL
    mem_limit: 768m
    cpus: 0.5
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  django:
    image: main-django:${MAIN_IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: deploy/oci/django.Dockerfile
    command: ["serve"]
    environment:
      <<: *django-common-environment
      MAIN_MODERATION_MEDIA_ENABLED: ${MAIN_MODERATION_MEDIA_ENABLED:-false}
      OPENAI_API_KEY_FILE: /run/secrets/openai_api_key
    secrets:
      - mysql_django_password
      - mysql_ca
      - django_secret
      - openai_api_key
    depends_on:
      provision-admin:
        condition: service_completed_successfully
    networks:
      private:
        ipv4_address: 172.29.0.4
      egress: {}
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1',8090),3); s.close()"]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    mem_limit: 1g
    cpus: 0.5
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  retention:
    profiles: ["retention"]
    image: main-django:${MAIN_IMAGE_TAG:-local}
    command: ["retention"]
    environment:
      <<: *django-common-environment
      MAIN_RETENTION_APPLY: ${MAIN_RETENTION_APPLY:-}
    secrets:
      - mysql_retention_password
      - mysql_ca
      - django_secret
    depends_on:
      database-permissions:
        condition: service_completed_successfully
    networks:
      private: {}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: 0.25
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  caddy:
    image: caddy:2.11.4-alpine
    environment:
      MAIN_DOMAIN: ${MAIN_DOMAIN}
      MAIN_DJANGO_UPSTREAM: 172.29.0.4:8090
      MAIN_SPRING_UPSTREAM: 172.29.0.3:8088
    ports:
      - 80:80
      - 443:443
    volumes:
      - ../Caddyfile:/etc/caddy/Caddyfile:ro
      - ../routes.caddy:/etc/caddy/routes.caddy:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      spring:
        condition: service_healthy
      django:
        condition: service_healthy
    networks:
      private:
        ipv4_address: 172.29.0.2
      egress: {}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --no-check-certificate --header=\"Host: $${MAIN_DOMAIN}\" -O - https://127.0.0.1/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 20s
      timeout: 8s
      retries: 10
      start_period: 45s
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.25
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

networks:
  private:
    internal: true
    ipam:
      config:
        - subnet: 172.29.0.0/24
  egress: {}

volumes:
  mysql-data: {}
  caddy-data: {}
  caddy-config: {}

secrets:
  mysql_root_password:
    file: ./secrets/mysql_root_password
  mysql_operator_password:
    file: ./secrets/mysql_operator_password
  mysql_migration_password:
    file: ./secrets/mysql_migration_password
  mysql_spring_password:
    file: ./secrets/mysql_spring_password
  mysql_django_password:
    file: ./secrets/mysql_django_password
  mysql_retention_password:
    file: ./secrets/mysql_retention_password
  django_secret:
    file: ./secrets/django_secret
  push_encryption_key:
    file: ./secrets/push_encryption_key
  admin_initial_password:
    file: ./secrets/admin_initial_password
  openai_api_key:
    file: ./secrets/openai_api_key
  firebase_credentials:
    file: ./secrets/firebase-credentials.json
  mysql_ca:
    file: ./secrets/mysql-ca.pem
  mysql_server_cert:
    file: ./secrets/mysql-server.crt
  mysql_server_key:
    file: ./secrets/mysql-server.key
