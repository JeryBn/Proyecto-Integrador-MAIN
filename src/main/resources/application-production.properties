# Run behind an HTTPS reverse proxy on the same host. No demo accounts or in-memory database.
server.address=127.0.0.1
server.port=8088
spring.datasource.url=jdbc:mysql://${MAIN_DB_HOST}:${MAIN_DB_PORT:3306}/${MAIN_DB_NAME}?sslMode=VERIFY_IDENTITY&serverTimezone=UTC
spring.datasource.username=${MAIN_DB_USER}
spring.datasource.password=${MAIN_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=never
spring.flyway.baseline-on-migrate=false
spring.h2.console.enabled=false
main.demo.enabled=false
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.forward-headers-strategy=NONE
