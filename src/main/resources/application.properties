server.address=127.0.0.1
server.port=8088
spring.datasource.url=jdbc:h2:mem:main;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=never
spring.flyway.enabled=true
main.demo.enabled=true
server.servlet.session.timeout=30m
server.error.include-message=never
spring.jackson.time-zone=America/Lima
spring.config.import=optional:file:./.env.local[.properties]
main.ai.model=${OPENAI_MODEL:gpt-5-mini}

spring.servlet.multipart.max-file-size=12MB
spring.servlet.multipart.max-request-size=13MB
main.media.ffmpeg-directory=${MAIN_MEDIA_FFMPEG_DIRECTORY:}
