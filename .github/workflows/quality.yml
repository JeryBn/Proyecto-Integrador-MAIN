name: COLEGIA web y base compartida
on:
  push:
    branches: [main, web/frontend-backend]
    paths: ['backend/**', 'frontend/**', 'database/**', 'scripts/**', 'docker-compose.yml', '.env.example', '.github/workflows/quality.yml']
  pull_request:
    paths: ['backend/**', 'frontend/**', 'database/**', 'scripts/**', 'docker-compose.yml', '.env.example', '.github/workflows/quality.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web-spring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven, cache-dependency-path: backend/springboot/pom.xml}
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: 'frontend/*/package-lock.json'}
      - run: npm --prefix frontend/usuario ci && npm --prefix frontend/admin ci
      - run: npm --prefix frontend/usuario test && npm --prefix frontend/admin test
      - run: npm --prefix frontend/usuario run build && npm --prefix frontend/admin run build && node scripts/sync-web.mjs
      - run: mvn -B -ntp -f backend/springboot/pom.xml -Dspring.profiles.active=test test
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: spring-tests, path: backend/springboot/target/surefire-reports}
  django:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm --prefix frontend/usuario ci && npm --prefix frontend/admin ci
      - run: npm --prefix frontend/usuario run build && npm --prefix frontend/admin run build && node scripts/sync-web.mjs
      - run: sudo apt-get update && sudo apt-get install -y default-libmysqlclient-dev pkg-config
      - run: pip install -r backend/django-admin/requirements.txt
      - run: python manage.py test administration --settings=main_admin.test_settings --noinput
        working-directory: backend/django-admin
  compose-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: colegia-ci-${{ github.run_id }}
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: SyntheticComposeAdmin2026!
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose build
      - run: docker compose up -d --wait --wait-timeout 300
      - run: docker compose exec -T django-admin python manage.py seed_colegia
      - run: python scripts/verify-compose.py
      - name: Verificar persistencia y reinicio con IA desactivada
        run: |
          docker compose restart mysql springboot django-admin
          docker compose up -d --wait --wait-timeout 300
          python scripts/verify-compose.py
      - if: failure()
        run: docker compose ps && docker compose logs --no-color --tail=100
      - if: always()
        run: docker compose down
