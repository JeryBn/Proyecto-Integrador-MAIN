name: Calidad integral

on:
  push:
    branches: [main, integracion/colegia-pamela]
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'frontend/**'
      - 'admin-django/**'
      - 'deploy/oci/**'
      - 'deploy/Caddyfile'
      - '.dockerignore'
      - 'compose.yaml'
      - '.env.example'
      - 'scripts/Test-ReleaseReadiness.ps1'
      - 'scripts/Test-ReleaseReadinessContract.ps1'
      - 'scripts/Test-OciDeployment.ps1'
      - '.github/workflows/quality.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'frontend/**'
      - 'admin-django/**'
      - 'deploy/oci/**'
      - 'deploy/Caddyfile'
      - '.dockerignore'
      - 'compose.yaml'
      - '.env.example'
      - 'scripts/Test-ReleaseReadiness.ps1'
      - 'scripts/Test-ReleaseReadinessContract.ps1'
      - 'scripts/Test-OciDeployment.ps1'
      - '.github/workflows/quality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: calidad-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spring-y-web:
    name: Spring y web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Validar preflight de entrega
        shell: pwsh
        run: |
          & ./scripts/Test-ReleaseReadinessContract.ps1
          $output = & ./scripts/Test-ReleaseReadiness.ps1 -Json -AllowIncomplete
          $summary = $output | ConvertFrom-Json
          if ($null -eq $summary.ready -or $summary.checks.Count -lt 10) {
            throw 'El preflight no devolvió el contrato JSON esperado.'
          }
          Write-Host "Preflight válido; bloqueos externos detectados: $($summary.blockers)."
      - name: Validar contrato de despliegue OCI
        shell: pwsh
        run: ./scripts/Test-OciDeployment.ps1
      - name: Validar scripts y composición OCI
        shell: bash
        run: bash -n deploy/oci/*.sh deploy/oci/mysql/*.sh
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias web
        working-directory: frontend
        run: npm ci
      - name: Probar y compilar web
        working-directory: frontend
        run: |
          npm audit --audit-level=moderate
          node --test test/*.test.*
          node build.mjs
      - name: Verificar que los archivos servidos están actualizados
        run: git diff --exit-code -- src/main/resources/static
      - name: Probar y compilar los portales integrados
        run: |
          for portal in usuario admin; do
            npm --prefix "frontend/$portal" ci
            npm --prefix "frontend/$portal" test
            npm --prefix "frontend/$portal" run build
          done
      - name: Probar Spring Boot
        run: mvn --batch-mode --no-transfer-progress test
      - name: Guardar informes Spring
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informes-spring
          path: target/surefire-reports
          if-no-files-found: warn

  django:
    name: Administración Django
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: admin-django/requirements.txt
      - name: Preparar controlador MySQL
        run: |
          sudo apt-get update
          sudo apt-get install --yes default-libmysqlclient-dev pkg-config
      - name: Instalar dependencias
        run: python -m pip install --disable-pip-version-check -r admin-django/requirements.txt
      - name: Probar administración aislada
        working-directory: admin-django
        run: python manage.py test administration --settings=main_admin.test_settings --noinput -v 2

  docker-local:
    name: Demostración Docker
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Preparar entorno aislado
        run: |
          for key in MAIN_LOCAL_DB_PASSWORD MAIN_LOCAL_DJANGO_SECRET MAIN_LOCAL_ADMIN_PASSWORD; do
            value=$(openssl rand -hex 24)
            echo "::add-mask::$value"
            echo "$key=$value" >> "$GITHUB_ENV"
          done
      - name: Construir y levantar MAIN
        run: docker compose up --build --detach --wait --wait-timeout 360
      - name: Comprobar acceso web, Android y administración
        run: |
          curl -fsS http://127.0.0.1:8088/actuator/health
          curl -fsS http://127.0.0.1:8088/portada.html | grep -F 'COLEGIA'
          curl -fsS http://127.0.0.1:8088/login-modern.css > /dev/null
          curl -fsS http://127.0.0.1:8090/api/admin/health
          curl -fsS http://127.0.0.1:8090/assets/admin.js > /dev/null
          curl -fsS --retry 5 --retry-connrefused http://127.0.0.1:5173/login.html | grep -F 'COLEGIA'
          curl -fsS http://127.0.0.1:5174/api/admin/health
          cookies=$(mktemp)
          trap 'rm -f "$cookies"' EXIT
          token=$(curl -fsS -c "$cookies" http://127.0.0.1:5173/login-token | jq -r .token)
          curl -fsS -b "$cookies" -c "$cookies" --data-urlencode "_csrf=$token" \
            --data-urlencode username=alumno --data-urlencode 'password=MainDemo2026!' http://127.0.0.1:5173/login
          curl -fsS -b "$cookies" http://127.0.0.1:5173/api/actividades | jq -e 'type == "array"'
          curl -fsS -b "$cookies" http://127.0.0.1:5173/api/actividades/1/entrega | jq -e 'has("revision")'
          token=$(curl -fsS -b "$cookies" http://127.0.0.1:5173/api/csrf | jq -r .token)
          curl -fsS -b "$cookies" -X PUT -H "X-CSRF-TOKEN: $token" -H 'Content-Type: application/json' \
            --data '{"note":"Evidencia de prueba","evidenceUrl":"","status":"DRAFT","expectedRevision":0}' \
            http://127.0.0.1:5173/api/actividades/1/entrega | jq -e '.saved and (.submitted | not) and (.revision == 1)'
          curl -fsS -b "$cookies" http://127.0.0.1:5173/api/v1/campus/feed | jq -e 'type == "array"'
          token=$(curl -fsS -c "$cookies" http://127.0.0.1:5174/api/admin/csrf | jq -r .token)
          curl -fsS -b "$cookies" -c "$cookies" -H "X-CSRFToken: $token" \
            --data-urlencode username=admin_local --data-urlencode "password=$MAIN_LOCAL_ADMIN_PASSWORD" \
            http://127.0.0.1:5174/api/admin/login | jq -e '.rol == "ADMIN"'
      - name: Mostrar estado si falla
        if: failure()
        run: docker compose ps --all
      - name: Retirar entorno sintético
        if: always()
        run: docker compose down --volumes --remove-orphans

  oracle-cloud:
    name: Despliegue Oracle Cloud
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Generar configuración privada sintética
        working-directory: deploy/oci
        run: bash ./prepare.sh --domain ci.main.invalid --admin-username ci.admin --admin-name 'Administrador CI'
      - name: Construir imágenes de producción
        working-directory: deploy/oci
        run: |
          docker compose pull mysql database-permissions caddy
          docker compose build --pull spring django
      - name: Validar proxy sin solicitar certificados
        working-directory: deploy/oci
        run: docker compose run --rm --no-deps --entrypoint caddy caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Iniciar base y aplicaciones privadas
        working-directory: deploy/oci
        run: docker compose up --detach --wait --wait-timeout 360 spring django
      - name: Comprobar migraciones, TLS y administrador inicial
        working-directory: deploy/oci
        run: |
          docker compose exec --no-TTY spring curl --fail --silent http://127.0.0.1:8088/actuator/health
          docker compose exec --no-TTY django /app/entrypoint.sh verify
      - name: Mostrar diagnóstico si falla
        if: failure()
        working-directory: deploy/oci
        run: |
          docker compose ps
          docker compose logs --no-color --tail=160
      - name: Retirar entorno sintético
        if: always()
        working-directory: deploy/oci
        run: docker compose down --volumes --remove-orphans
